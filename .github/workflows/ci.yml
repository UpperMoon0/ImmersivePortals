name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immersive-portals-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Build, JUnit, and GameTests
        run: python3 tools/verify.py core
      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification
          if-no-files-found: warn
          path: |
            build/verification-core.json
            build/reports/tests/**
            build/test-results/**
            runs/gameTestServer/logs/**

  graphical-e2e:
    name: Sable dedicated graphical E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install headless graphics runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - run: chmod +x ./gradlew
      - name: Dedicated server and automated client
        run: python3 tools/verify.py e2e
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sable-dimension-stack-e2e
          if-no-files-found: warn
          path: |
            build/verification-e2e.json
            build/sable-dimension-stack-e2e/**
            run-sable-e2e-server/crash-reports/**
            run-sable-e2e-client/crash-reports/**
            run-sable-e2e-server/logs/**
            run-sable-e2e-client/logs/**
