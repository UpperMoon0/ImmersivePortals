name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: immersive-portals-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select integration checks
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            echo "e2e=$(python3 tools/ci_policy.py "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == workflow_dispatch || "$REF" == refs/heads/main ]]; then
            echo 'e2e=true' >> "$GITHUB_OUTPUT"
          else
            echo 'e2e=false' >> "$GITHUB_OUTPUT"
          fi

  core:
    name: Core verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Build, JUnit, and GameTests
        run: python3 tools/verify.py core
      - name: Receiver concurrency against newer upstream APIs
        run: |
          for version in '4.3.0+5c124ecf19' '4.3.1+7e3d421f19'; do
            ./gradlew test -PverificationNetworking="$version" --tests '*FabricReceiverRegistrationTest' --no-daemon --no-configuration-cache
          done
      - name: Record main release artifact provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: release_bundle
        run: python3 tools/release_evidence.py record
      - name: Preserve exact tested main jar
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-main-release-bundle
          if-no-files-found: error
          path: |
            ${{ steps.release_bundle.outputs.jar_path }}
            build/libs/ci-release-evidence.json
      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification
          if-no-files-found: warn
          path: |
            build/verification-core.json
            build/reports/tests/**
            build/test-results/**
            runs/gameTestServer/logs/**

  # Draft baseline coverage only. This does not replace an existing E2E lane
  # or alter the Required verification/release acceptance contract.
  sable-ship-flight:
    name: Sable ship flight (draft) / ${{ matrix.mode }} / ${{ matrix.transport }} / ${{ matrix.ship_size }} / bundled
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    # Twelve minutes for a cold dedicated-server startup, twenty for the client,
    # plus setup, diagnostics, cleanup and always-uploaded artifacts.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { transport: udp, mode: ships, ship_size: control }
          - { transport: tcp, mode: ships, ship_size: control }
          - { transport: udp, mode: ships, ship_size: large }
          - { transport: tcp, mode: ships, ship_size: large }
          - { transport: udp, mode: ships-aeronautics, ship_size: control }
          - { transport: udp, mode: ships-aeronautics, ship_size: large }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Ensure headless graphics runtime
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! ldconfig -p | grep -F 'libGL.so.1' >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
      - name: Configure Sable transport
        env:
          TRANSPORT: ${{ matrix.transport }}
          MODE: ${{ matrix.mode }}
          SHIP_SIZE: ${{ matrix.ship_size }}
        run: |
          runtime=run-sable-ship-flight
          if [[ "$MODE" == ships-aeronautics ]]; then runtime+=-aeronautics; fi
          if [[ "$SHIP_SIZE" != all ]]; then runtime+="-$SHIP_SIZE"; fi
          echo "SHIP_RUNTIME_PREFIX=$runtime" >> "$GITHUB_ENV"
          mkdir -p "$runtime-server/config" "$runtime-client/config"
          if [[ "$TRANSPORT" == tcp ]]; then
            cat > "$runtime-server/config/sable-common.toml" <<'EOF'
          disable_udp_pipeline = true
          attempt_udp_networking = false
          EOF
            cat > "$runtime-client/config/sable-client.toml" <<'EOF'
          attempt_udp_networking = false
          EOF
          else
            cat > "$runtime-server/config/sable-common.toml" <<'EOF'
          disable_udp_pipeline = false
          attempt_udp_networking = true
          EOF
            cat > "$runtime-client/config/sable-client.toml" <<'EOF'
          attempt_udp_networking = true
          EOF
          fi
          cp "$runtime-server/config/sable-common.toml" "$runtime-client/config/sable-common.toml"
      - run: chmod +x ./gradlew
      - name: Dedicated complex ship flight and graphical client
        env:
          IP_VERIFICATION_NETWORKING: bundled
          IP_NETWORK_STRESS: 'false'
        run: python3 tools/verify.py "${{ matrix.mode }}" --ship-size "${{ matrix.ship_size }}"
      - name: Upload ship flight evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sable-ship-flight-e2e-${{ matrix.mode }}-${{ matrix.transport }}-${{ matrix.ship_size }}-bundled
          if-no-files-found: warn
          path: |
            build/verification-ships*.json
            build/sable-ship-flight*-e2e/**
            ${{ env.SHIP_RUNTIME_PREFIX }}-server/config/sable-common.toml
            ${{ env.SHIP_RUNTIME_PREFIX }}-client/config/sable-common.toml
            ${{ env.SHIP_RUNTIME_PREFIX }}-client/config/sable-client.toml
            ${{ env.SHIP_RUNTIME_PREFIX }}-server/crash-reports/**
            ${{ env.SHIP_RUNTIME_PREFIX }}-client/crash-reports/**
            ${{ env.SHIP_RUNTIME_PREFIX }}-server/logs/**
            ${{ env.SHIP_RUNTIME_PREFIX }}-client/logs/**

  graphical-e2e:
    name: Sable graphical E2E / ${{ matrix.transport }} / ${{ matrix.networking }} / ${{ matrix.network }}
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        transport: [udp, tcp]
        networking: [bundled, '4.3.0+5c124ecf19', '4.3.1+7e3d421f19']
        network: [normal]
        include:
          - { transport: udp, networking: '4.3.1+7e3d421f19', network: impaired }
          - { transport: tcp, networking: '4.3.1+7e3d421f19', network: impaired }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Ensure headless graphics runtime
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! ldconfig -p | grep -F 'libGL.so.1' >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
      - name: Configure Sable transport
        env:
          TRANSPORT: ${{ matrix.transport }}
        run: |
          mkdir -p run-sable-e2e-server/config run-sable-e2e-client/config
          if [[ "$TRANSPORT" == tcp ]]; then
            cat > run-sable-e2e-server/config/sable-common.toml <<'EOF'
          disable_udp_pipeline = true
          attempt_udp_networking = false
          EOF
            cat > run-sable-e2e-client/config/sable-client.toml <<'EOF'
          attempt_udp_networking = false
          EOF
          else
            cat > run-sable-e2e-server/config/sable-common.toml <<'EOF'
          disable_udp_pipeline = false
          attempt_udp_networking = true
          EOF
            cat > run-sable-e2e-client/config/sable-client.toml <<'EOF'
          attempt_udp_networking = true
          EOF
          fi
          cp run-sable-e2e-server/config/sable-common.toml run-sable-e2e-client/config/sable-common.toml
      - run: chmod +x ./gradlew
      - name: Dedicated server and automated client
        env:
          IP_VERIFICATION_NETWORKING: ${{ matrix.networking }}
          IP_VERIFICATION_NEOFORGE: ${{ matrix.networking == '4.3.1+7e3d421f19' && '21.1.248' || '21.1.228' }}
          IP_NETWORK_STRESS: ${{ matrix.network == 'impaired' && 'true' || 'false' }}
        run: python3 tools/verify.py e2e
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sable-dimension-stack-e2e-${{ matrix.transport }}-${{ matrix.networking }}-${{ matrix.network }}
          if-no-files-found: warn
          path: |
            build/verification-e2e.json
            build/sable-dimension-stack-e2e/**
            run-sable-e2e-server/config/sable-common.toml
            run-sable-e2e-client/config/sable-common.toml
            run-sable-e2e-client/config/sable-client.toml
            run-sable-e2e-server/crash-reports/**
            run-sable-e2e-client/crash-reports/**
            run-sable-e2e-server/logs/**
            run-sable-e2e-client/logs/**

  portal-visual:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { renderer: vanilla, sable: true }
          - { renderer: sodium, sable: true }
          - { renderer: iris, sable: true }
          - { renderer: iris-active, sable: true }
          - { renderer: embeddium, sable: false }
          - { renderer: neoculus, sable: false }
          - { renderer: neoculus-active, sable: false }
          - { renderer: veil, sable: false }
          - { renderer: vanilla, sable: false }
          - { renderer: iris-active, sable: true, shadow_fixture: true }
          - { renderer: neoculus-active, sable: false, shadow_fixture: true }
          - { renderer: iris-active, sable: true, shadow_fixture: true, negative_control: shadow-clipping-enabled }
          - { renderer: neoculus-active, sable: false, shadow_fixture: true, negative_control: shadow-clipping-enabled }
          - { renderer: iris-active, sable: true, negative_control: pack-disabled }
          - { renderer: iris-active, sable: true, negative_control: clipping-disabled }
          - { renderer: iris-active, sable: true, negative_control: entity-clipping-disabled }
          - { renderer: iris-active, sable: true, negative_control: particle-clipping-disabled }
          - { renderer: neoculus-active, sable: false, negative_control: entity-clipping-disabled }
          - { renderer: neoculus-active, sable: false, negative_control: particle-clipping-disabled }
          - { renderer: iris-active, sable: true, render_mode: compatibility }
          - { renderer: iris-active, sable: true, render_mode: compatibility, disable_copy_image: true }
          - { renderer: iris-active, sable: true, render_mode: compatibility, gl_context: no-copy-image }
          - { renderer: iris-active, sable: true, render_mode: debug, disable_copy_image: true }
          - { renderer: vanilla, sable: false, flywheel_backend: off }
          - { renderer: vanilla, sable: false, flywheel_backend: instancing }
          - { renderer: vanilla, sable: false, flywheel_backend: indirect }
    uses: ./.github/workflows/visual.yml
    with:
      renderer: ${{ matrix.renderer }}
      sable: ${{ matrix.sable }}
      shadow_fixture: ${{ matrix.shadow_fixture || false }}
      real_pack: none
      negative_control: ${{ matrix.negative_control || 'none' }}
      flywheel_backend: ${{ matrix.flywheel_backend || 'default' }}
      render_mode: ${{ matrix.render_mode || 'normal' }}
      disable_copy_image: ${{ matrix.disable_copy_image || false }}
      gl_context: ${{ matrix.gl_context || 'default' }}

  # Start the measured critical path immediately after selection. Each lane
  # owns its runtime; the aggregate still requires core, both transports and
  # every one of the 30 graphical configurations, even when a fast check fails.
  real-pack-visual:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { renderer: iris-active, sable: true, real_pack: makeup }
          - { renderer: iris-active, sable: true, real_pack: complementary }
          - { renderer: neoculus-active, sable: false, real_pack: makeup }
          - { renderer: neoculus-active, sable: false, real_pack: complementary }
    uses: ./.github/workflows/visual.yml
    with:
      renderer: ${{ matrix.renderer }}
      sable: ${{ matrix.sable }}
      real_pack: ${{ matrix.real_pack }}

  required:
    name: Required verification
    if: always()
    needs: [changes, core, graphical-e2e, portal-visual, real-pack-visual]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all selected checks
        env:
          SELECT: ${{ needs.changes.result }}
          CORE: ${{ needs.core.result }}
          HEAVY: ${{ needs.graphical-e2e.result }}
          VISUAL: ${{ needs.portal-visual.result }}
          REAL_PACKS: ${{ needs.real-pack-visual.result }}
          REQUIRED: ${{ needs.changes.outputs.e2e }}
        run: |
          [[ "$SELECT" == success && "$CORE" == success ]]
          [[ "$REQUIRED" == true || "$REQUIRED" == false ]]
          if [[ "$REQUIRED" == true ]]; then
            [[ "$HEAVY" == success && "$VISUAL" == success && "$REAL_PACKS" == success ]]
          else
            [[ "$HEAVY" == skipped && "$VISUAL" == skipped && "$REAL_PACKS" == skipped ]]
          fi
