name: Tag on version bump

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-on-version-bump
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Tag verified version and explicitly dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version_at() {
            git show "$1:gradle.properties" | sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' | head -n1 | tr -d '\r' | xargs
          }
          version="$(version_at HEAD)"
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]
          tag="v$version"
          # Also recover a version bump whose first CI run failed or was cancelled.
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo 'Tag already exists; use manual Release dispatch to retry publishing.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "Immersive Portals - CE $version"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref main -f tag="$tag"
