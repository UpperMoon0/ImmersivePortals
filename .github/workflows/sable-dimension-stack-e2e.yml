name: Sable dimension-stack dedicated E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sable-dimension-stack-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dedicated-client-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Prepare dedicated server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-sable-e2e-server build/sable-dimension-stack-e2e
          printf 'eula=true\n' > run-sable-e2e-server/eula.txt
          cat > run-sable-e2e-server/server.properties <<'PROPS'
          online-mode=false
          enforce-secure-profile=false
          gamemode=creative
          difficulty=peaceful
          spawn-protection=0
          view-distance=6
          simulation-distance=6
          enable-command-block=true
          server-port=25565
          PROPS
          chmod +x gradlew

      - name: Start dedicated server
        shell: bash
        env:
          IP_SABLE_E2E: 'true'
          IP_SABLE_E2E_RESULT_DIR: ${{ github.workspace }}/build/sable-dimension-stack-e2e
        run: |
          set -euo pipefail
          RESULT_DIR="$IP_SABLE_E2E_RESULT_DIR"
          SERVER_LOG="$RESULT_DIR/server.log"
          : > "$SERVER_LOG"

          setsid bash -c 'tail -f /dev/null | ./gradlew runSableE2EServer --no-daemon --no-configuration-cache' >"$SERVER_LOG" 2>&1 &
          echo $! > "$RESULT_DIR/server.pid"

          for i in $(seq 1 360); do
            if grep -q 'Done (' "$SERVER_LOG"; then
              exit 0
            fi
            if ! kill -0 "$(cat "$RESULT_DIR/server.pid")" 2>/dev/null; then
              echo 'Dedicated server exited before becoming ready.' >&2
              tail -n 200 "$SERVER_LOG" >&2
              exit 1
            fi
            sleep 1
          done

          echo 'Timed out waiting for dedicated server startup.' >&2
          tail -n 200 "$SERVER_LOG" >&2
          exit 1

      - name: Run graphical client integration scenario
        shell: bash
        env:
          IP_SABLE_E2E: 'true'
          IP_SABLE_E2E_RESULT_DIR: ${{ github.workspace }}/build/sable-dimension-stack-e2e
        run: |
          set -euo pipefail
          RESULT_DIR="$IP_SABLE_E2E_RESULT_DIR"
          CLIENT_LOG="$RESULT_DIR/client.log"

          set +e
          timeout 180s xvfb-run -a ./gradlew runSableE2EClient --no-daemon --no-configuration-cache >"$CLIENT_LOG" 2>&1
          CLIENT_EXIT=$?
          set -e

          if [[ -f "$RESULT_DIR/client-fail.txt" ]]; then
            cat "$RESULT_DIR/client-fail.txt" >&2
            tail -n 200 "$CLIENT_LOG" >&2
            exit 1
          fi
          if [[ ! -f "$RESULT_DIR/client-pass.txt" ]]; then
            echo "Client did not produce a pass marker (exit=$CLIENT_EXIT)." >&2
            tail -n 200 "$CLIENT_LOG" >&2
            exit 1
          fi

      - name: Require authoritative server result
        shell: bash
        env:
          IP_SABLE_E2E_RESULT_DIR: ${{ github.workspace }}/build/sable-dimension-stack-e2e
        run: |
          set -euo pipefail
          RESULT_DIR="$IP_SABLE_E2E_RESULT_DIR"

          for i in $(seq 1 60); do
            if [[ -f "$RESULT_DIR/server-fail.txt" ]]; then
              cat "$RESULT_DIR/server-fail.txt" >&2
              exit 1
            fi
            if [[ -f "$RESULT_DIR/server-pass.txt" ]]; then
              cat "$RESULT_DIR/server-pass.txt"
              cat "$RESULT_DIR/client-pass.txt"
              exit 0
            fi
            sleep 1
          done

          echo 'Server did not produce a result marker.' >&2
          tail -n 200 "$RESULT_DIR/server.log" >&2 || true
          exit 1

      - name: Stop dedicated server
        if: always()
        shell: bash
        run: |
          PID_FILE=build/sable-dimension-stack-e2e/server.pid
          if [[ -f "$PID_FILE" ]]; then
            PID="$(cat "$PID_FILE")"
            kill -- -"$PID" 2>/dev/null || kill "$PID" 2>/dev/null || true
          fi

      - name: Upload integration logs and markers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sable-dimension-stack-e2e
          if-no-files-found: warn
          path: |
            build/sable-dimension-stack-e2e/**
            run-sable-e2e-server/logs/**
            run-sable-e2e-client/logs/**
