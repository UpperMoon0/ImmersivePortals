name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build and validate Immersive Portals
        run: ./gradlew clean test runGameTestServer build --no-daemon

      - name: Read mod version and locate artifacts
        id: release_file
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ -z "$mod_version" ]]; then
            echo "mod_version is missing from gradle.properties" >&2
            exit 1
          fi
          if [[ ! "$mod_version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            printf 'Invalid mod_version: %q\n' "$mod_version" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "v${mod_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match mod_version v${mod_version}" >&2
            exit 1
          fi

          jar_path="build/libs/immersive_portals-${mod_version}.jar"
          if [[ ! -f "$jar_path" ]]; then
            echo "Release jar not found at $jar_path" >&2
            exit 1
          fi

          changelog_path="changelog/${mod_version}.md"
          if [[ ! -f "$changelog_path" ]]; then
            echo "Missing changelog for ${mod_version} at ${changelog_path}" >&2
            exit 1
          fi

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "changelog_path=$changelog_path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-ce-neoforge-1.21.1-${{ steps.release_file.outputs.mod_version }}
          path: ${{ steps.release_file.outputs.jar_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release_file.outputs.mod_version }}
          name: Immersive Portals - CE v${{ steps.release_file.outputs.mod_version }}
          body_path: ${{ steps.release_file.outputs.changelog_path }}
          fail_on_unmatched_files: true
          files: ${{ steps.release_file.outputs.jar_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || '1672810' }}
          MOD_VERSION: ${{ steps.release_file.outputs.mod_version }}
          CHANGELOG_PATH: ${{ steps.release_file.outputs.changelog_path }}
          JAR_PATH: ${{ steps.release_file.outputs.jar_path }}
          MINECRAFT_VERSION: '1.21.1'
          LOADER_NAME: 'NeoForge'
          JAVA_VERSION_NAME: 'Java 21'
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing required GitHub secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi

          game_version_names="$(jq -cn \
            --arg minecraftVersion "$MINECRAFT_VERSION" \
            --arg loaderName "$LOADER_NAME" \
            --arg javaVersionName "$JAVA_VERSION_NAME" \
            '[$minecraftVersion, $loaderName, $javaVersionName, "Client", "Server"]')"

          available_versions="$(curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            'https://minecraft.curseforge.com/api/game/versions')"
          while IFS= read -r version_name; do
            if ! jq -e --arg name "$version_name" 'any(.[]; .name == $name)' \
              <<< "$available_versions" >/dev/null; then
              echo "CurseForge does not recognize game version tag: ${version_name}" >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$game_version_names")

          changelog="$(<"$CHANGELOG_PATH")"
          relations='{"projects":[{"slug":"cloth-config","projectID":348521,"type":"requiredDependency"},{"slug":"sable","projectID":1312371,"type":"optionalDependency"}]}'
          metadata="$(jq -cn \
            --arg changelog "$changelog" \
            --arg displayName "Immersive Portals - CE ${MOD_VERSION} - ${LOADER_NAME} ${MINECRAFT_VERSION}" \
            --argjson gameVersionNames "$game_version_names" \
            --argjson relations "$relations" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: $gameVersionNames,
              releaseType: "release",
              relations: $relations
            }')"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@${JAR_PATH}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          response="$(<"$response_file")"
          if [[ "$http_status" =~ ^2 ]]; then
            file_id="$(jq -er '.id' <<< "$response")"
            echo "Published ${JAR_PATH} to CurseForge as file ID ${file_id}."
          else
            echo "CurseForge upload failed with HTTP ${http_status}: ${response}" >&2
            exit 1
          fi