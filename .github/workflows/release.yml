name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and publish (v6.0.9)
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-workflow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  core-verification:
    name: Core verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x ./gradlew
      - name: Build, JUnit, and GameTests
        run: python3 tools/verify.py core
      - name: Upload core diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-verification
          if-no-files-found: warn
          path: |
            build/verification-core.json
            build/reports/tests/**
            build/test-results/**
            runs/gameTestServer/logs/**
      - name: Preserve verified release jar
        uses: actions/upload-artifact@v4
        with:
          name: verified-release-jar
          path: build/libs/immersive_portals-*.jar
          if-no-files-found: error

  graphical-e2e:
    name: Sable dedicated graphical E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Ensure headless graphics runtime
        timeout-minutes: 5
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1 || ! ldconfig -p | grep -F 'libGL.so.1' >/dev/null; then
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 update
            sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=2 install -y xvfb libgl1-mesa-dri
          fi
      - run: chmod +x ./gradlew
      - name: Dedicated server and automated client
        run: python3 tools/verify.py e2e
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-sable-dimension-stack-e2e
          if-no-files-found: warn
          path: |
            build/verification-e2e.json
            build/sable-dimension-stack-e2e/**
            run-sable-e2e-server/crash-reports/**
            run-sable-e2e-client/crash-reports/**
            run-sable-e2e-server/logs/**
            run-sable-e2e-client/logs/**

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { renderer: vanilla, sable: true }
          - { renderer: sodium, sable: true }
          - { renderer: iris, sable: true }
          - { renderer: iris-active, sable: true }
          - { renderer: embeddium, sable: false }
          - { renderer: neoculus, sable: false }
          - { renderer: neoculus-active, sable: false }
          - { renderer: veil, sable: false }
          - { renderer: vanilla, sable: false }
          - { renderer: iris-active, sable: true, negative_control: pack-disabled }
          - { renderer: iris-active, sable: true, negative_control: clipping-disabled }
          - { renderer: iris-active, sable: true, negative_control: entity-clipping-disabled }
          - { renderer: iris-active, sable: true, negative_control: particle-clipping-disabled }
          - { renderer: neoculus-active, sable: false, negative_control: entity-clipping-disabled }
          - { renderer: neoculus-active, sable: false, negative_control: particle-clipping-disabled }
          - { renderer: iris-active, sable: true, render_mode: compatibility }
          - { renderer: iris-active, sable: true, render_mode: compatibility, disable_copy_image: true }
          - { renderer: iris-active, sable: true, render_mode: compatibility, gl_context: no-copy-image }
          - { renderer: iris-active, sable: true, render_mode: debug, disable_copy_image: true }
          - { renderer: vanilla, sable: false, flywheel_backend: off }
          - { renderer: vanilla, sable: false, flywheel_backend: instancing }
          - { renderer: vanilla, sable: false, flywheel_backend: indirect }
          - { renderer: iris-active, sable: true, real_pack: makeup }
          - { renderer: iris-active, sable: true, real_pack: complementary }
          - { renderer: neoculus-active, sable: false, real_pack: makeup }
          - { renderer: neoculus-active, sable: false, real_pack: complementary }
    uses: ./.github/workflows/visual.yml
    with:
      ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      renderer: ${{ matrix.renderer }}
      sable: ${{ matrix.sable }}
      real_pack: ${{ matrix.real_pack || 'none' }}
      negative_control: ${{ matrix.negative_control || 'none' }}
      flywheel_backend: ${{ matrix.flywheel_backend || 'default' }}
      render_mode: ${{ matrix.render_mode || 'normal' }}
      disable_copy_image: ${{ matrix.disable_copy_image || false }}
      gl_context: ${{ matrix.gl_context || 'default' }}

  release:
    name: Publish verified release
    needs:
      - core-verification
      - graphical-e2e
      - compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: Restore verified release jar
        uses: actions/download-artifact@v4
        with:
          name: verified-release-jar
          path: build/libs
      - name: Read mod version and locate artifacts
        id: release_file
        shell: bash
        run: |
          set -euo pipefail

          mod_version="$(sed -n 's/^mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | head -n1 | tr -d '\r' | xargs)"
          if [[ -z "$mod_version" ]]; then
            echo "mod_version is missing from gradle.properties" >&2
            exit 1
          fi
          if [[ ! "$mod_version" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            printf 'Invalid mod_version: %q\n' "$mod_version" >&2
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != "v${mod_version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match mod_version v${mod_version}" >&2
            exit 1
          fi

          jar_path="build/libs/immersive_portals-${mod_version}.jar"
          if [[ ! -f "$jar_path" ]]; then
            echo "Release jar not found at $jar_path" >&2
            exit 1
          fi

          changelog_path="changelog/${mod_version}.md"
          if [[ ! -f "$changelog_path" ]]; then
            echo "Missing changelog for ${mod_version} at ${changelog_path}" >&2
            exit 1
          fi

          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "changelog_path=$changelog_path" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: immersive-portals-ce-neoforge-1.21.1-${{ steps.release_file.outputs.mod_version }}
          path: ${{ steps.release_file.outputs.jar_path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release_file.outputs.mod_version }}
          name: Immersive Portals - CE v${{ steps.release_file.outputs.mod_version }}
          body_path: ${{ steps.release_file.outputs.changelog_path }}
          fail_on_unmatched_files: true
          files: ${{ steps.release_file.outputs.jar_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to CurseForge
        shell: bash
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || '1672810' }}
          MOD_VERSION: ${{ steps.release_file.outputs.mod_version }}
          CHANGELOG_PATH: ${{ steps.release_file.outputs.changelog_path }}
          JAR_PATH: ${{ steps.release_file.outputs.jar_path }}
          MINECRAFT_VERSION: '1.21.1'
          LOADER_NAME: 'NeoForge'
          JAVA_VERSION_NAME: 'Java 21'
        run: |
          set -euo pipefail
          if [[ -z "${CURSEFORGE_API_TOKEN:-}" ]]; then
            echo "Missing required GitHub secret: CURSEFORGE_API_TOKEN" >&2
            exit 1
          fi

          game_version_names="$(jq -cn \
            --arg minecraftVersion "$MINECRAFT_VERSION" \
            --arg loaderName "$LOADER_NAME" \
            --arg javaVersionName "$JAVA_VERSION_NAME" \
            '[$minecraftVersion, $loaderName, $javaVersionName, "Client", "Server"]')"

          available_versions="$(curl --fail-with-body --silent --show-error \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            'https://minecraft.curseforge.com/api/game/versions')"
          while IFS= read -r version_name; do
            if ! jq -e --arg name "$version_name" 'any(.[]; .name == $name)' \
              <<< "$available_versions" >/dev/null; then
              echo "CurseForge does not recognize game version tag: ${version_name}" >&2
              exit 1
            fi
          done < <(jq -r '.[]' <<< "$game_version_names")

          changelog="$(<"$CHANGELOG_PATH")"
          relations='{"projects":[{"slug":"cloth-config","projectID":348521,"type":"requiredDependency"},{"slug":"sable","projectID":1312371,"type":"optionalDependency"}]}'
          metadata="$(jq -cn \
            --arg changelog "$changelog" \
            --arg displayName "Immersive Portals - CE ${MOD_VERSION} - ${LOADER_NAME} ${MINECRAFT_VERSION}" \
            --argjson gameVersionNames "$game_version_names" \
            --argjson relations "$relations" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: $gameVersionNames,
              releaseType: "release",
              relations: $relations
            }')"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@${JAR_PATH}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"
          response="$(<"$response_file")"
          if [[ "$http_status" =~ ^2 ]]; then
            file_id="$(jq -er '.id' <<< "$response")"
            echo "Published ${JAR_PATH} to CurseForge as file ID ${file_id}."
          else
            echo "CurseForge upload failed with HTTP ${http_status}: ${response}" >&2
            exit 1
          fi
